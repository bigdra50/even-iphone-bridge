name: EvenG2Bridge
options:
  bundleIdPrefix: com.bigdra50
  deploymentTarget:
    iOS: "16.0"
packages:
  Swifter:
    url: https://github.com/httpswift/swifter.git
    from: "1.5.0"
targets:
  EvenG2Bridge:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: Swifter
        product: Swifter
    info:
      path: Sources/Info.plist
      properties:
        # Apple Music の now-playing 読取・制御に必要
        NSAppleMusicUsageDescription: "再生中の曲をグラスに表示し、再生を制御します。"
        # 歩数 (CMPedometer) に必要。欠落すると実機で startUpdates が SIGABRT する
        NSMotionUsageDescription: "歩数をグラスに表示するため、モーションと運動データを使用します。"
        # 同一 Wi-Fi の別端末 (Mac companion) から LAN IP で接続するのに必要 (iOS 14+)
        NSLocalNetworkUsageDescription: "同一 Wi-Fi の端末から接続して情報を表示するため、ローカルネットワークを使用します。"
        # バックグラウンド (EvenApp 前面 / 端末ロック中) でも HTTP サーバーを生かす
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigdra50.eveng2bridge
        # 実機署名 (Xcode GUI で設定した Team を regenerate で消さないため project.yml に固定)
        DEVELOPMENT_TEAM: ML46C5PYU7
        CODE_SIGN_STYLE: Automatic
        # Swift 6 strict concurrency を避けて 5 言語モードで素直にビルド
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    # テストを EvenG2Bridge scheme の test アクションに紐付ける (xcodebuild test 用)
    scheme:
      testTargets:
        - EvenG2BridgeTests
  # test アクションへの紐付けは EvenG2Bridge target の scheme.testTargets が担う
  EvenG2BridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: EvenG2Bridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigdra50.eveng2bridge.tests
        SWIFT_VERSION: "5.0"
        # Info.plist を持たないので Xcode に自動生成させる
        GENERATE_INFOPLIST_FILE: "YES"
